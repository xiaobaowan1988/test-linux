apiVersion: v1
kind: ConfigMap
metadata:
  name: test-cm
  namespace: default
data:
  greeting: "hello from arm64 Linux 7.1-rc7"
  arch: "aarch64"
---
apiVersion: v1
kind: Secret
metadata:
  name: test-secret
  namespace: default
type: Opaque
stringData:
  token: "arm64-test-token"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-sa
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: default
spec:
  selector:
    app: hello-deploy
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-deploy
  template:
    metadata:
      labels:
        app: hello-deploy
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
      - name: hello
        image: docker.io/library/hello:latest
        command: ["/bin/sleep", "300"]
        imagePullPolicy: Never
        securityContext:
          seccompProfile:
            type: Unconfined
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: test-pv
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/test-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: manual
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: test-ingress-class
spec:
  controller: example.com/test-ingress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  namespace: default
spec:
  ingressClassName: test-ingress-class
  rules:
  - host: hello.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hello-svc
            port:
              number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hello-pdb
  namespace: default
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: hello-deploy
---
apiVersion: batch/v1
kind: Job
metadata:
  name: test-job
  namespace: default
spec:
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
      - name: job
        image: docker.io/library/hello:latest
        command: ["/bin/echo", "job-done"]
        imagePullPolicy: Never
        securityContext:
          seccompProfile:
            type: Unconfined
