apiVersion: v1
kind: ConfigMap
metadata:
  name: test-cm
  namespace: default
data:
  greeting: "hello from arm64 Linux 7.1-rc7"
  arch: "aarch64"
---
apiVersion: v1
kind: Secret
metadata:
  name: test-secret
  namespace: default
type: Opaque
stringData:
  token: "arm64-test-token"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-sa
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: default
spec:
  selector:
    app: hello-deploy
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-deploy
  template:
    metadata:
      labels:
        app: hello-deploy
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
      - name: hello
        image: docker.io/library/hello-http:latest
        command: ["/bin/hello-http"]
        imagePullPolicy: Never
        securityContext:
          seccompProfile:
            type: Unconfined
---
# CSI driver registration object
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: test.csi.k8s.io
spec:
  attachRequired: false
  podInfoOnMount: false
---
# StorageClass backed by our test CSI driver
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: test-csi
provisioner: test.csi.k8s.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
# PVC that will be dynamically provisioned by test-csi driver
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: test-csi
---
# Pod that mounts the CSI-provisioned PVC and writes a file to verify volume works
apiVersion: v1
kind: Pod
metadata:
  name: csi-consumer
  namespace: default
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: Unconfined
  containers:
  - name: consumer
    image: docker.io/library/hello:latest
    command: ["/bin/sleep", "300"]
    imagePullPolicy: Never
    securityContext:
      seccompProfile:
        type: Unconfined
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: test-pvc
---
# IngressClass served by our test-ingress controller
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: test-ingress-class
  annotations:
    ingressclass.kubernetes.io/is-default-class: "false"
spec:
  controller: test.ingress.k8s.io/test-ingress
---
# Ingress routing hello.example.com → hello-svc:80
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  namespace: default
spec:
  ingressClassName: test-ingress-class
  rules:
  - host: hello.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hello-svc
            port:
              number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hello-pdb
  namespace: default
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: hello-deploy
---
apiVersion: batch/v1
kind: Job
metadata:
  name: test-job
  namespace: default
spec:
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
      - name: job
        image: docker.io/library/hello:latest
        command: ["/bin/echo", "job-done"]
        imagePullPolicy: Never
        securityContext:
          seccompProfile:
            type: Unconfined
